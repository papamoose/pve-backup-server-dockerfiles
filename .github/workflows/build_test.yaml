on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - .github/workflows/*.yaml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/proxmox-backup-server

jobs:
  docker-build:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-24.04-arm
            arch: arm64
          - runs_on: ubuntu-24.04
            arch: amd64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set tag name
      run:
        if [[ -n "${{ github.event.pull_request.number }}" ]]; then
          echo "TAG=github-pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV;
        else
          echo "TAG=ref-${{ github.ref_name }}" >> $GITHUB_ENV;
        fi
    - name: Run docker for ${{matrix.arch}}
      env:
        TAG: ${{ env.TAG }}
      run: ./release.bash "${{ env.REGISTRY }}:${{ env.TAG }}" build-image build-deb

    # Push Artifacts to GitHub
    - uses: actions/upload-artifact@v4
      with:
        name: server-${{ matrix.arch }}
        path: release/

    # Push to GHCR
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image for ${{matrix.arch}}
      run: ./release.bash "${{ env.REGISTRY }}:${{ env.TAG }}" push-image

  client-build:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-24.04-arm
            arch: arm64
          - runs_on: ubuntu-24.04
            arch: amd64
          - runs_on: ubuntu-24.04-arm
            arch: arm32
            continue_on_error: true
    env:
      ARCH: ${{ matrix.arch }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set tag name
      run:
        if [[ -n "${{ github.event.pull_request.number }}" ]]; then
          echo "TAG=github-pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV;
        else
          echo "TAG=ref-${{ github.ref_name }}" >> $GITHUB_ENV;
        fi

    # Compile the client
    - name: Run client for ${{ matrix.arch }}
      id: build
      continue-on-error: ${{ matrix.continue_on_error || false }}
      run: ./release.bash "${{ env.REGISTRY }}:${{ env.TAG }}" client-tgz
    - name: Warn on failure
      if: steps.build.outcome == 'failure'
      run: echo "::warning::${{ matrix.arch }} client build failed"

    # Push Artifacts to GitHub
    - uses: actions/upload-artifact@v4
      with:
        name: client-${{ matrix.arch }}
        path: release/

  manifest:
    runs-on: ubuntu-latest
    needs: [client-build, docker-build]
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set tag name
      run:
        if [[ -n "${{ github.event.pull_request.number }}" ]]; then
          echo "TAG=github-pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV;
        else
          echo "TAG=ref-${{ github.ref_name }}" >> $GITHUB_ENV;
        fi
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create manifest
      run: ./release.bash "${{ env.REGISTRY }}:${{ env.TAG }}" manifest
    - name: Comment image name on PR
      if: github.event_name == 'pull_request'
      env:
        REGISTRY: ${{ env.REGISTRY }}
        TAG: ${{ env.TAG }}
      uses: actions/github-script@v7
      with:
        script: |
          const imageName = `${{ env.REGISTRY }}:${{ env.TAG }}`;
          const body = `✅ Docker image pushed: \`${imageName}\``;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });
